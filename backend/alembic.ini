# Alembic Configuration File
# - Async SQLAlchemy + asyncpg
# - Auto-generates migrations from model changes
# - Supports both "online" (connected) and "offline" (SQL dump) modes

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the "create date" field. The value set here for tz_localize can be
# passed by any external tools such as CI/CD :
# source .venv/bin/activate
# export ALEMBIC_DATE_FORMAT='UTC'
# alembic revision --m 'add new field'
# The value of tz_utc is used as offset input only
# If it is false, the value is used as tzlocal, if true then utc.
# What kind of datetime object is even possible is dependent from different features
# of the underlying database so it's recommended to not rely on it at all.
# Due to datetime objects always have a `tzinfo` with UTC when
# the timezone locale is set to a constant offset +X or -X then the CONVERT_TIMEZONE call does
# produce a constant offset as well.
# If leave the UTC offset to d, then the CONVERT_TIMEZONE will return NULL
#
# for more examples and background see https://alembic.sqlalchemy.org/en/latest/faq.html#what-does-the-sqlalchemy-url-setting-in-the-ini-file-mean
sqlalchemy.url = driver://user:password@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
